# Opt-in overlay, brought up by `make observability`. Kept out of docker-compose.yml because a metrics
# UI has no business on the box it is watching, and Prometheus grows with retention and series count
# while that stack is sized for a 1 GiB t4g.micro. See docs/observability.md.

# Same escape hatch as docker-compose.yml: behind corporate TLS interception dockerd cannot verify
# docker.io, so point DOCKER_REGISTRY at an internal mirror. Unset is correct everywhere else.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: ${DOCKER_REGISTRY:-docker.io}/prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The TSDB is the only copy of the history — the app keeps nothing. ~2 MB/day here, so 90 days
      # is ~200 MB.
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # host.docker.internal is a Docker Desktop / Colima nicety; this makes it resolve on Linux too.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Loopback only. A public box must not serve its own dashboards to the internet.
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  loki:
    image: ${DOCKER_REGISTRY:-docker.io}/grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    # Loki is pushed to, not scraped, so unlike Prometheus it must be reachable while the app runs.
    # Still loopback: alloy and grafana reach it over the compose network, not this port.
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging

  alloy:
    image: ${DOCKER_REGISTRY:-docker.io}/grafana/alloy:v1.5.1
    environment:
      # Which compose project's containers to collect. compose defaults it to the directory name, and
      # alloy.alloy falls back to that same default when it is unset.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # Read-only: alloy only lists containers and reads their logs. It is still the whole daemon —
      # the reason this overlay stays off any box that is not yours.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    restart: unless-stopped
    mem_limit: 192m
    logging: *logging

  grafana:
    image: ${DOCKER_REGISTRY:-docker.io}/grafana/grafana:11.5.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Not 3000, which WEB_PORT has. Overridable because 3001 is a popular choice — another
    # project's dev server on it silently wins localhost and you get its 404 page, not Grafana.
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus, loki]
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

volumes:
  prometheus-data:
  # Loki's chunks and its WAL. Same durability boundary as prometheus-data: the app keeps nothing.
  loki-data:
  # Alloy's read positions. Losing it re-reads each container's log from the start, which duplicates
  # lines rather than losing them.
  alloy-data:
  grafana-data:
